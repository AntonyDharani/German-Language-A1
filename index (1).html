const picsOf=lv=>PICS.filter(p=>p.lv===lv);
const picDone=id=>!!(S.pics&&S.pics[id]);
let picLv='A1', pv=null;
const artCls=w=>/^der /.test(w)?'m':/^die /.test(w)?'f':/^das /.test(w)?'n':'x';
const _img={};
const SVGIMG=(p)=>{if(!_img[p.id]){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><defs>${DEFS}</defs>${p.s()}<rect width="400" height="260" fill="url(#sVig)"/></svg>`;_img[p.id]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace(/&(?!amp;|lt;|gt;|quot;|#\d+;)/g,'&amp;'));}return `<img src="${_img[p.id]}" alt="${esc(p.t[1])}" loading="lazy" decoding="async">`};
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}};

function picFeature(){
  const all=PICS.length, d=PICS.filter(p=>picDone(p.id)).length, sample=PICS[0];
  return `<section class="feat glass" onclick="picHub()"><div class="feat-art">${SVGIMG(sample)}</div>
   <div class="feat-body"><h3>Bild beschreiben</h3><p>Describe a picture · A1 to C2 · type it or say it aloud</p>
   <div class="mini"><i style="width:${d/all*100}%"></i></div><small>${d}/${all} pictures done</small></div>${I('right')}</section>`;
}
function picHub(lv){
  if(lv) picLv=lv; pv=null;
  const list=picsOf(picLv), done=list.filter(p=>picDone(p.id)).length;
  let h=`<div class="top blur"><button class="back" onclick="home()">${I('left')}Path</button><div class="qbar"><i style="width:${list.length?done/list.length*100:0}%"></i></div><span class="qcount">${done}/${list.length}</span></div>
  <div class="phead"><h2>Bild beschreiben</h2><p>Look at a picture and describe it in German. Write it, say it aloud, or think it, then compare with the model description.</p></div>
  <div class="lvtabs">${LEVELS.map(l=>{const n=picsOf(l).length;return `<button class="lv ${l===picLv?'on':''}" ${n?`onclick="picHub('${l}')"`:'disabled'}>${l}${n?'':'<small>soon</small>'}</button>`}).join('')}</div>`;
  if(!list.length){h+=`<div class="glass empty">The ${picLv} pictures are coming in the next update.</div>`;}
  else{
    const nxt=list.find(p=>!picDone(p.id))||list[0];
    h+=`<div class="row" style="margin:4px 0 14px"><button class="btn" onclick="openPic('${nxt.id}')">${I('play')} ${done?'Continue':'Start'}</button><button class="btn ghost" onclick="openPic('${list[Math.floor(Math.random()*list.length)].id}')">${I('redo')} Random picture</button></div>
    <div class="pgrid">${list.map((p,i)=>`<button class="pcard glass" onclick="openPic('${p.id}')">${SVGIMG(p)}<span class="pn">${i+1}</span>${picDone(p.id)?`<span class="pdone">${I('check')}</span>`:''}<b>${esc(p.t[0])}</b></button>`).join('')}</div>`;
  }
  app.innerHTML=h; window.scrollTo(0,0);
}
function openPic(id){
  const p=PICS.find(x=>x.id===id); if(!p) return;
  picLv=p.lv;
  pv={p,help:0,shown:false,tr:false,text:(S.picText&&S.picText[id])||''};
  renderPic(); window.scrollTo(0,0);
}
function renderPic(){
  const p=pv.p, T=TASK[p.lv], list=picsOf(p.lv), idx=list.indexOf(p);
  let h=`<div class="top blur"><button class="back" onclick="picHub()">${I('left')}Pictures</button><div class="qbar"><i style="width:${(idx+1)/list.length*100}%"></i></div><span class="qcount">${idx+1}/${list.length}</span></div>
  <div class="picbox glass">${SVGPIC(p.s(),'bigpic')}<span class="lvtag">${p.lv}</span></div>
  <div class="task glass"><div class="task-h"><h3>${esc(T.de)}</h3><button class="tool ${pv.tr?'on':''}" onclick="pv.tr=!pv.tr;renderPic()">${I('globe')}${pv.tr?'Hide':'Translate'}</button></div>
   ${pv.tr?`<div class="trl"><span>${esc(T.en)}</span><span class="ta">${esc(T.ta)}</span></div>`:''}
   <ul class="qs">${T.q.map(q=>`<li>${esc(q[0])}${pv.tr?`<span class="trl"><span>${esc(q[1])}</span><span class="ta">${esc(q[2])}</span></span>`:''}</li>`).join('')}</ul></div>`;
  h+=`<div class="answer glass"><label for="ptext"><b>Your description</b> <span class="sub" id="pcount"></span></label>
   <textarea id="ptext" rows="6" placeholder="Auf dem Bild sehe ich …" oninput="pvInput(this.value)" spellcheck="false">${esc(pv.text)}</textarea>
   <div class="uml">${['ä','ö','ü','ß'].map(u=>`<button onclick="pvIns('${u}')">${u}</button>`).join('')}<button class="mic" id="micbtn" onclick="pvMic()">${I('mic')}Speak</button></div>
   <div id="micmsg" class="sub" style="margin-top:6px"></div></div>`;
  if(!pv.shown){
    if(pv.help>=1) h+=`<div class="helpbox glass"><h4>${I('bulb')}Key words <span class="sub">tap to add</span></h4><div class="chips">${p.v.map(v=>`<button class="kchip ${artCls(v[0])}" onclick="pvIns('${esc(v[0].replace(/^(der|die|das) /,''))} ')">${esc(v[0])}</button>`).join('')}</div>${pv.tr||pv.help>=1?`<div class="sub" style="margin-top:8px">Meanings appear with the model description.</div>`:''}</div>`;
    if(pv.help>=2) h+=`<div class="helpbox glass"><h4>${I('chat')}Sentence starters <span class="sub">tap to add</span></h4><div class="chips">${T.st.map(s=>`<button class="kchip x" onclick="pvIns('${esc(s.replace(' …',' '))}')">${esc(s)}</button>`).join('')}</div></div>`;
    h+=`<div class="row">${pv.help<2?`<button class="btn ghost" onclick="pv.help++;renderPic()">${I('help')}${pv.help?'More help':'I need help'}</button>`:''}<button class="btn" onclick="pvShow()">${I('check')} ${pv.text.trim()?'Check & show model':'Show model description'}</button></div>`;
  } else h+=resultHTML();
  app.innerHTML=h; pvCount();
}
function pvInput(v){pv.text=v;S.picText=S.picText||{};S.picText[pv.p.id]=v;save();pvCount();}
function pvCount(){const el=document.getElementById('pcount');if(!el)return;const w=pv.text.trim()?pv.text.trim().split(/\s+/).length:0,sn=(pv.text.match(/[.!?](\s|$)/g)||[]).length;el.textContent=w?`· ${w} words · ${sn} sentence${sn===1?'':'s'}`:'';}
function pvIns(t){const i=document.getElementById('ptext');const a=i.selectionStart??i.value.length,b=i.selectionEnd??a;i.value=i.value.slice(0,a)+t+i.value.slice(b);i.focus();i.setSelectionRange(a+t.length,a+t.length);pvInput(i.value);}
let rec=null;
function pvMic(){
  const m=document.getElementById('micmsg'),btn=document.getElementById('micbtn');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){m.textContent='Speech input is not available here. Open the installed app in Chrome, or say it aloud and then tap “Show model description”.';return;}
  if(rec){try{rec.stop()}catch(e){}return;}
  try{rec=new SR();rec.lang='de-DE';rec.interimResults=false;rec.continuous=true;
    rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t){const s=t.trim();pvIns((pv.text&&!/\s$/.test(pv.text)?' ':'')+s.charAt(0).toUpperCase()+s.slice(1)+'. ');}};
    rec.onerror=e=>{m.textContent=e.error==='not-allowed'?'Microphone permission was refused. Allow the microphone for this site, or type your description.':'Could not hear you clearly. Try again or type it.';};
    rec.onend=()=>{rec=null;btn.classList.remove('on');btn.innerHTML=I('mic')+'Speak';};
    rec.start();btn.classList.add('on');btn.innerHTML=I('mic')+'Stop';m.textContent='Listening… speak German now.';
  }catch(e){rec=null;m.textContent='Speech input could not start here. Try the installed app in Chrome.';}
}
const stem=w=>{w=norm(w.replace(/^(der|die|das|ein|eine|sich) /,'').split(' ')[0]);return w.length>5?w.replace(/(en|n|e)$/,''):w};
function pvShow(){if(rec){try{rec.stop()}catch(e){}}pv.shown=true;S.pics=S.pics||{};S.pics[pv.p.id]=1;save();renderPic();setTimeout(()=>{const r=document.getElementById('result');if(r)r.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})},60);}
function resultHTML(){
  const p=pv.p,T=TASK[p.lv],txt=norm(pv.text);
  let h='<div id="result">';
  if(pv.text.trim()){
    const used=p.v.map(v=>txt.includes(stem(v[0])));const n=used.filter(Boolean).length;
    const sn=Math.max((pv.text.match(/[.!?](\s|$)/g)||[]).length,pv.text.trim()?1:0);
    const msg=n>=p.v.length*.6&&sn>=T.min?'Great description! Compare it with the model to polish it.':n>=p.v.length*.3?'Good start. Look at the words you missed and add one or two more sentences.':'Read the model description and the word boxes, then try again in your own words.';
    h+=`<div class="fbk glass"><div class="fbk-top"><div class="fbk-n"><b>${n}/${p.v.length}</b><span>key words</span></div><div class="fbk-n"><b>${sn}</b><span>sentences (aim ${T.min}+)</span></div></div>
     <p>${msg}</p><div class="chips">${p.v.map((v,i)=>`<span class="uchip ${used[i]?'yes':''}">${used[i]?I('check'):''}${esc(v[0])}</span>`).join('')}</div>
     <div class="sub" style="margin-top:8px">This checks which key words you used, not your grammar. Read your text next to the model sentences below.</div></div>`;
  }
  h+=`<div class="model glass"><div class="task-h"><h3>Model description</h3><button class="tool" onclick="speak(pv.p.m.map(s=>s[0]).join(' '))">${I('play')}Listen</button></div>
   ${p.m.map((s,i)=>`<div class="sent reveal" style="animation-delay:${RM?0:i*70}ms"><div class="de"><span>${esc(s[0])}</span><button class="say" aria-label="Listen" onclick="speak(pv.p.m[${i}][0])">${I('vol')}</button></div><div class="en">${esc(s[1])}</div><div class="ta">${esc(s[2])}</div></div>`).join('')}</div>
   <div class="words glass"><div class="task-h"><h3>Word boxes</h3><span class="legend"><i class="m"></i>der <i class="f"></i>die <i class="n"></i>das</span></div>
   <div class="vgrid">${p.v.map(v=>`<button class="vbox ${artCls(v[0])}" onclick="speak('${esc(v[0]).replace(/'/g,"\\'")}')"><b>${esc(v[0])}</b><span>${esc(v[1])}</span><span class="ta">${esc(v[2])}</span></button>`).join('')}</div></div>`;
  const list=picsOf(p.lv),nx=list[list.indexOf(p)+1];
  h+=`<div class="row" style="margin-top:6px"><button class="btn ghost" onclick="pv.shown=false;pv.help=0;renderPic();window.scrollTo(0,0)">${I('redo')} Try again</button>${nx?`<button class="btn" onclick="openPic('${nx.id}')">Next picture ${I('arrow')}</button>`:`<button class="btn" onclick="picHub()">All pictures</button>`}</div></div>`;
  return h;
}

<script>
const KEY='begegnungen-a1-path-v1';
let S={done:{}};
try{const r=localStorage.getItem(KEY); if(r) S=JSON.parse(r);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();

/* ---------- icons (original line icons, 24 grid) ---------- */
const ICP={
 chat:'<path d="M4 6.5A3.5 3.5 0 0 1 7.5 3h9A3.5 3.5 0 0 1 20 6.5v6a3.5 3.5 0 0 1-3.5 3.5H11l-4.5 4v-4A3.5 3.5 0 0 1 4 12.5z"/><path d="M8.5 9.5h.01M12 9.5h.01M15.5 9.5h.01" stroke-width="3"/>',
 case:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A2.5 2.5 0 0 1 11.5 3h1A2.5 2.5 0 0 1 15 5.5V7M3 12.5h18M11 12.5v2h2v-2"/>',
 pin:'<path d="M12 21s-7-6.1-7-11.4A7 7 0 0 1 19 9.6C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.6" r="2.6"/>',
 cup:'<path d="M4 9.5h12.5v4.5A5 5 0 0 1 11.5 19h-2.5A5 5 0 0 1 4 14z"/><path d="M16.5 10.5h1.2a2.6 2.6 0 0 1 0 5.2h-1.4M8 3.5c-.9 1 .9 1.8 0 3.2M12 3.5c-.9 1 .9 1.8 0 3.2M3 21h15"/>',
 clock:'<circle cx="12" cy="12.5" r="8.5"/><path d="M12 8v4.8l3 1.9M9 2.5h6"/>',
 bag:'<rect x="4" y="7.5" width="16" height="12.5" rx="2.5"/><path d="M9 7.5V5h6v2.5M9 11v5.5M15 11v5.5M7 20v1.5M17 20v1.5"/>',
 house:'<path d="M3 11.2 12 4l9 7.2"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5M16 6V3.5h2v4"/>',
 gift:'<rect x="3" y="8.5" width="18" height="5" rx="1.2"/><path d="M5 13.5V21h14v-7.5M12 8.5V21M12 8.5c-1.5-4.5-6.5-4.6-6-2s6 2 6 2zM12 8.5c1.5-4.5 6.5-4.6 6-2s-6 2-6 2z"/>',
 book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 21H20v-3M8.5 7.5h7"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
 x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.3-2.5 3.8M12 17h.01" />',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',
 right:'<path d="M9 5l7 7-7 7"/>',
 redo:'<path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/>',
 layers:'<path d="M12 3 3 8l9 5 9-5zM3 13l9 5 9-5"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 21h7M9.5 17h5"/>',
 target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
 play:'<path d="M8 5.5v13l10-6.5z"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
 vol:'<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'
};
const I=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICP[n]}</svg>`;
const CHI={1:'chat',2:'case',3:'pin',4:'cup',5:'clock',6:'bag',7:'house',8:'gift'};
const STAR=c=>`<svg class="star ${c}" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="${c.includes('on')?'url(#gS)':'#d6e2f7'}" stroke="${c.includes('on')?'#f29a17':'#c3d3ef'}" stroke-width="1" stroke-linejoin="round"/></svg>`;

/* ---------- hero vector scene (original art) ---------- */
const SCENE=`<svg class="hero-art" viewBox="0 0 360 150" role="img" aria-label="A small German town with a passing train">
 <circle cx="300" cy="38" r="20" fill="#fff6c9"/><circle cx="300" cy="38" r="30" fill="#fff6c9" opacity=".35" class="sunglow"/>
 <g class="cloud c1" fill="#fff"><ellipse cx="60" cy="34" rx="24" ry="10"/><ellipse cx="76" cy="28" rx="15" ry="11"/></g>
 <g class="cloud c2" fill="#fff" opacity=".85"><ellipse cx="200" cy="22" rx="20" ry="8"/><ellipse cx="212" cy="18" rx="12" ry="8"/></g>
 <path d="M0 98 Q60 62 120 88 T250 80 T360 74 V150 H0z" fill="#9fd4ff"/>
 <path d="M0 112 Q90 84 180 104 T360 98 V150 H0z" fill="#cfeaff"/>
 <g>
  <rect x="150" y="56" width="12" height="40" fill="#5b8def"/><path d="M146 58 156 30 166 58z" fill="#2f6bff"/><circle cx="156" cy="66" r="3.4" fill="#fff"/>
  <path d="M96 80 116 62 136 80z" fill="#ff8a65"/><rect x="99" y="80" width="34" height="24" fill="#fff"/><path d="M99 80h34M116 80v24M99 92h34" stroke="#c9875c" stroke-width="1.6"/><rect x="104" y="84" width="7" height="6" fill="#7cc4ff"/><rect x="121" y="84" width="7" height="6" fill="#7cc4ff"/>
  <path d="M170 84 188 68 206 84z" fill="#ffb74d"/><rect x="173" y="84" width="30" height="20" fill="#fff"/><path d="M173 84 203 104M203 84 173 104" stroke="#d89b5a" stroke-width="1.4"/><rect x="184" y="92" width="8" height="12" fill="#5b8def"/>
  <path d="M212 88 226 74 240 88z" fill="#ff8a65"/><rect x="215" y="88" width="22" height="16" fill="#fff"/><rect x="220" y="92" width="5" height="5" fill="#7cc4ff"/><rect x="228" y="92" width="5" height="5" fill="#7cc4ff"/>
  <path d="M60 90 74 78 88 90z" fill="#ffb74d"/><rect x="63" y="90" width="22" height="14" fill="#fff"/><rect x="70" y="94" width="8" height="10" fill="#5b8def"/>
  <circle cx="260" cy="92" r="11" fill="#57c58f"/><rect x="258.5" y="100" width="3" height="8" fill="#8a6a4a"/><circle cx="40" cy="96" r="9" fill="#57c58f"/><rect x="38.5" y="102" width="3" height="7" fill="#8a6a4a"/>
 </g>
 <rect x="0" y="118" width="360" height="3" fill="#7fa8e8"/>
 <g fill="#7fa8e8">${Array.from({length:24},(_,i)=>`<rect x="${i*15+3}" y="121" width="6" height="2.4"/>`).join('')}</g>
 <g class="train">
  <rect x="0" y="100" width="58" height="18" rx="6" fill="#2f6bff"/><path d="M58 100h8a8 8 0 0 1 8 8v10H58z" fill="#1f4fe0"/>
  <rect x="6" y="104" width="10" height="7" rx="2" fill="#dff3ff"/><rect x="21" y="104" width="10" height="7" rx="2" fill="#dff3ff"/><rect x="36" y="104" width="10" height="7" rx="2" fill="#dff3ff"/><rect x="62" y="104" width="8" height="7" rx="2" fill="#dff3ff"/>
  <rect x="0" y="112" width="74" height="2.5" fill="#ffd84d"/>
  <rect x="-62" y="100" width="58" height="18" rx="6" fill="#4f9dff"/><rect x="-56" y="104" width="10" height="7" rx="2" fill="#dff3ff"/><rect x="-41" y="104" width="10" height="7" rx="2" fill="#dff3ff"/><rect x="-26" y="104" width="10" height="7" rx="2" fill="#dff3ff"/><rect x="-62" y="112" width="58" height="2.5" fill="#ffd84d"/>
  <g fill="#0b1b4a"><circle cx="-50" cy="119" r="3"/><circle cx="-16" cy="119" r="3"/><circle cx="12" cy="119" r="3"/><circle cx="46" cy="119" r="3"/><circle cx="66" cy="119" r="3"/></g>
 </g>
 <g class="bubble"><rect x="18" y="40" width="64" height="26" rx="13" fill="#fff"/><path d="M38 64 34 74 46 65z" fill="#fff"/><text x="50" y="57.5" text-anchor="middle" font-family="Sora,system-ui,sans-serif" font-weight="800" font-size="13" fill="#2f6bff">Hallo!</text></g>
</svg>`;

/* ---------- data helpers ---------- */
const FLAT=[];BOOK.forEach((c,ci)=>c.sections.forEach((s,si)=>{s.id=`k${c.n}s${si+1}`;(TR[s.id]||[]).forEach((t,k)=>{if(t&&s.qs[k])s.qs[k].tr=t});s.chap=c;s.idx=FLAT.length;FLAT.push(s);}));
const isDone=s=>!!S.done[s.id];
const unlocked=s=>s.idx===0||isDone(FLAT[s.idx-1])||isDone(s);
const nextIdx=()=>{const i=FLAT.findIndex(s=>!isDone(s));return i<0?null:i};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>String(t).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.,!?;:"“”]/g,'').replace(/\s+/g,' ').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById('app');
const tile=(n,extra='')=>`<div class="ctile ${extra}">${I(CHI[n])}</div>`;

/* ---------- HOME ---------- */
let openChap=null;
function home(){
  const total=FLAT.length, done=FLAT.filter(isDone).length, ni=nextIdx();
  if(openChap===null) openChap= ni===null?null:FLAT[ni].chap.n;
  const pct=Math.round(done/total*100), C=2*Math.PI*38;
  const vals=Object.values(S.done), answered=vals.reduce((a,r)=>a+r.total,0), right=vals.reduce((a,r)=>a+r.score,0);
  const chDone=BOOK.filter(c=>c.sections.every(isDone)).length;
  let h=`<section class="hero glass blur">${SCENE}<div class="hero-body"><div class="hero-top">
    <div class="ring"><svg width="88" height="88" viewBox="0 0 88 88">
      <circle cx="44" cy="44" r="38" fill="none" stroke="rgba(47,107,255,.14)" stroke-width="9"/>
      <circle class="arc" cx="44" cy="44" r="38" fill="none" stroke="url(#gB)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct/100)}"/></svg>
      <div class="pc"><div>${pct}%<small>done</small></div></div></div>
    <div><h1>Deutsch <span>A1</span></h1><p>Your study path through the 8 chapters of Begegnungen A1⁺</p></div></div>
    <div class="stats">
      <div class="stat"><div class="si">${I('layers')}</div><div><b>${done}/${total}</b><span>sections</span></div></div>
      <div class="stat"><div class="si">${I('trophy')}</div><div><b>${chDone}/8</b><span>chapters</span></div></div>
      <div class="stat"><div class="si">${I('target')}</div><div><b>${answered?Math.round(right/answered*100)+'%':'–'}</b><span>accuracy</span></div></div></div>
    ${ni===null?`<p style="color:var(--navy);font-weight:700">You finished every section! Now try the practice exam “Start Deutsch 1” in your book (page 222).</p>`
    :`<button class="btn wide" onclick="openSec(${ni})">${I('play')} ${done?'Continue':'Start'}: ${esc(FLAT[ni].title)}</button>`}</div></section>${picFeature()}`;
  BOOK.forEach((c,ci)=>{
    const nd=c.sections.filter(isDone).length, cd=nd===c.sections.length, open=openChap===c.n, isCur=ni!==null&&FLAT[ni].chap===c, lk=!unlocked(c.sections[0]);
    h+=`<div class="chap glass ${cd?'done':''} ${isCur?'cur':''} ${lk?'lockc':''} ${open?'open':''}" style="animation-delay:${RM?0:ci*55}ms"><div class="chap-h" onclick="toggle(${c.n})">${tile(c.n)}
      <div class="t"><h3>${esc(c.title)}</h3><small>Kapitel ${c.n} · pages ${c.pages} · ${nd}/${c.sections.length}</small><div class="mini"><i style="width:${nd/c.sections.length*100}%"></i></div></div><span class="chev">${I('right')}</span></div>`;
    if(open){h+='<div class="secs">';c.sections.forEach(s=>{
      const r=S.done[s.id], un=unlocked(s), cur=s.idx===ni;
      const cls=r?(r.score/r.total>=.75?'ok':'mid'):(cur?'cur':(un?'':'lock'));
      const icon=r?(r.score/r.total>=.75?I('check'):'<b style="font:800 14px var(--H)">!</b>'):(cur?I('play'):(un?'':I('lock')));
      h+=`<button class="sec ${cls}" ${un?`onclick="openSec(${s.idx})"`:'disabled'}><span class="dot">${icon}</span>
        <span class="st">${esc(s.title)}${s.review?'<span class="tag">Test</span>':''}<br><span class="sc">Pages ${s.pages}${r?` · best ${r.score}/${r.total}`:(cur?' · up next':'')}</span></span></button>`;});
      h+='</div>';}
    h+='</div>';
  });
  h+=`<div class="foot">Use these practice questions together with the exercises in your book.<br>Progress is saved on this device. <button class="reset" onclick="resetAll()">Reset progress</button></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const a=document.querySelector('.arc');if(a)a.style.strokeDashoffset=a.dataset.off;}));
}
function toggle(n){openChap=openChap===n?-1:n;const y=scrollY;home();scrollTo(0,y);}
function resetAll(){
  const f=document.querySelector('.foot');
  f.innerHTML=`Delete all progress? <button class="reset" onclick="S={done:{}};save();openChap=null;home()">Yes, reset</button> · <button class="reset" onclick="home()">Cancel</button>`;
}

/* ---------- SECTION ---------- */
let cur=null;
function openSec(i,onlyWrong){
  const s=FLAT[i];
  let list=s.qs.map((q,k)=>({...q,k}));
  if(onlyWrong&&cur&&cur.sec===s) list=cur.items.filter(it=>!it.correct).map(it=>it.q);
  cur={sec:s,items:list.map(q=>({q,ans:q.t==='w'?[]:null,opts:q.t==='m'?shuffle(q.o):null,bank:q.t==='w'?shuffle(q.a[0].split('|')):null})),checked:false,retry:!!onlyWrong};
  renderSec();window.scrollTo(0,0);
}
const answeredCount=()=>cur.items.filter(it=>it.dk||(it.q.t==='w'?it.ans.length:(it.ans&&String(it.ans).trim()))).length;
function renderSec(){
  const s=cur.sec,c=s.chap, tot=cur.items.length, ans=answeredCount();
  let h=`<div class="top blur"><button class="back" onclick="home()">${I('left')}Path</button><div class="qbar"><i id="qbar" style="width:${cur.checked?100:ans/tot*100}%"></i></div><span class="qcount" id="qcount">${cur.checked?'Done':ans+'/'+tot}</span></div>
  <div class="shead">${tile(c.n)}<div><div class="sub">Kapitel ${c.n} · ${esc(c.title)}</div><h2>${esc(s.title)}${s.review?'<span class="tag" style="background:#fff">Test</span>':''}</h2></div></div>
  <span class="pill">${I('book')}Book pages ${s.pages}</span>`;
  if(cur.checked){
    const sc=cur.items.filter(i=>i.correct).length,p=sc/tot,C=2*Math.PI*62;
    const stars=p>=.9?3:p>=.6?2:p>=.3?1:0;
    const praise=p===1?'Perfekt!':p>=.75?'Sehr gut!':p>=.5?'Gut gemacht!':'Weiter so!';
    const msg=p===1?'Everything is right. Brilliant work!':p>=.75?'Very good! Read the explanations for your mistakes.':p>=.5?'Good start. Check your mistakes below, then retry them.':'Keep going! Read the “Learn this first” notes and the book pages again, then retry.';
    h+=`<div class="score glass blur"><div class="sring"><svg width="150" height="150" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(47,107,255,.13)" stroke-width="12"/>
      <circle id="sarc" cx="75" cy="75" r="62" fill="none" stroke="${p>=.5?'url(#gB)':'#ffa62b'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-p)}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/></svg>
      <div class="snum"><div><span id="cnt">0</span>/${tot}<small>correct</small></div></div></div>
      <div class="stars">${STAR((stars>=1?'on':'')+' s1')}${STAR((stars>=2?'on':'')+' mid s2')}${STAR((stars>=3?'on':'')+' s3')}</div>
      <div class="praise">${praise}</div><p>${msg}</p></div>`;
  } else {
    h+=`<div class="learn glass"><div class="bulb">${I('bulb')}</div><div><h4>Learn this first</h4><ul>${s.learn.map(l=>`<li>${l}</li>`).join('')}</ul></div></div>`;
    if(cur.retry) h+=`<div class="sub" style="margin-bottom:10px;color:#fff;font-weight:700">Retrying only the questions you got wrong.</div>`;
  }
  cur.items.forEach((it,n)=>h+=`<div id="q${n}" class="${cur.checked?'reveal':''}" style="${cur.checked&&!RM?`animation-delay:${900+Math.min(n,8)*70}ms`:''}">${qHTML(it,n)}</div>`);
  if(!cur.checked){
    h+=`<div id="msg" class="msg"></div><button class="btn wide" onclick="check()">${I('check')} Check my answers</button>`;
  } else {
    const ni=s.idx+1<FLAT.length?s.idx+1:null, wrong=cur.items.some(i=>!i.correct);
    h+=`<div class="row" style="margin-top:6px">${wrong?`<button class="btn ghost" onclick="openSec(${s.idx},true)">${I('redo')} Retry my mistakes</button>`:''}
      ${ni!==null?`<button class="btn" onclick="openSec(${ni})">Next: ${esc(FLAT[ni].title)} ${I('arrow')}</button>`:`<button class="btn" onclick="home()">Back to path</button>`}</div>
      <div style="text-align:center;margin-top:14px"><button class="linkbtn" onclick="openSec(${s.idx})">Do the whole section again</button></div>`;
  }
  app.innerHTML=h; cur.items.forEach((it,n)=>{if(it.q.t==='w')fixH(n)});
  if(cur.checked) celebrate();
}
function qHTML(it,n){
  const q=it.q, ch=cur.checked;
  const badge=ch?(it.dk?`<span class="badge dk pop">${I('help')}</span>`:it.correct?`<span class="badge ok pop">${I('check','draw')}</span>`:`<span class="badge bad pop">${I('x','draw')}</span>`):'';
  let h=`<div class="q glass ${ch?(it.correct?'right':'wrong'):(it.dk?'dk':'')}"><div class="qn">${badge}Question ${n+1} of ${cur.items.length}</div><div class="qt">${esc(q.q)}</div>`;
  h+=`<div class="tools">${q.tr?`<button class="tool ${it.showTr?'on':''}" onclick="togTr(${n})">${I('globe')}${it.showTr?'Hide translation':'Translate'}</button>`:''}${!ch&&!it.dk?`<button class="tool" onclick="setDk(${n},true)">${I('help')}I don’t know</button>`:''}</div>`;
  if(it.showTr&&q.tr) h+=`<div class="trbox">${esc(q.tr)}</div>`;
  if(it.dk&&!ch){h+=`<div class="dkbox"><span>Marked as “I don’t know”. You’ll see the answer after checking.</span><button class="tool" onclick="setDk(${n},false)">Undo</button></div></div>`;return h;}
  if(q.t==='m'){
    h+='<div class="opts">'+it.opts.map(o=>{
      let cls=''; if(!ch){if(it.ans===o)cls='sel';} else {if(o===q.o[0])cls='good';else if(it.ans===o)cls='badpick';}
      return `<button class="opt ${cls}" ${ch?'disabled':''} onclick="pick(${n},this)" data-v="${esc(o)}">${esc(o)}</button>`;}).join('')+'</div>';
  } else if(q.t==='f'){
    h+=`<input class="fill" id="f${n}" value="${esc(it.ans||'')}" ${ch?'disabled':''} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer in German" oninput="cur.items[${n}].ans=this.value;bar()">`;
    if(!ch) h+=`<div class="uml">${['ä','ö','ü','ß'].map(u=>`<button onclick="ins(${n},'${u}')">${u}</button>`).join('')}</div>`;
  } else {
    h+=`<div class="built">${it.ans.map((w,k)=>`<button class="chip" ${ch?'disabled':''} onclick="unbuild(${n},${k})">${esc(it.bank[w])}</button>`).join('')||'<span class="sub">Tap the words below in the right order</span>'}</div>`;
    if(!ch) h+=`<div class="bank">${it.bank.map((w,k)=>`<button class="chip ${it.ans.includes(k)?'used':''}" onclick="build(${n},${k})">${esc(w)}</button>`).join('')}</div>`;
  }
  if(ch){
    const yours=q.t==='w'?it.ans.map(k=>it.bank[k]).join(' '):(it.ans||'');
    const right=q.t==='m'?q.o[0]:q.t==='f'?q.a[0]:q.a[0].split('|').join(' ')+'.';
    const ex=`<div class="ex">${I('bulb')}<div>${q.e}</div></div>`;
    if(it.dk) h+=`<div class="fb"><span class="lab" style="color:#5a6c9e">You marked: I don’t know</span><br><span class="lab ok">Correct answer:</span> ${esc(right)}${ex}</div>`;
    else h+=`<div class="fb">${it.correct?`<span class="lab ok">Correct!</span>${it.loose?` <span class="sub">(correct spelling: ${esc(right)})</span>`:''}`
      :`<span class="lab bad">Your answer:</span> ${yours?esc(yours):'<i>(empty)</i>'}<br><span class="lab ok">Correct:</span> ${esc(right)}`}${ex}</div>`;
  }
  return h+'</div>';
}
function bar(){if(cur.checked)return;const t=cur.items.length,a=answeredCount();const b=document.getElementById('qbar'),c=document.getElementById('qcount');if(b)b.style.width=a/t*100+'%';if(c)c.textContent=a+'/'+t;}
function upd(n){const box=document.getElementById('q'+n);box.innerHTML=qHTML(cur.items[n],n);fixH(n);bar();}
function fixH(n){const box=document.getElementById('q'+n),b=box&&box.querySelector('.built'),k=box&&box.querySelector('.bank');if(!b||!k)return;const it=cur.items[n];if(!it.h)it.h=k.offsetHeight+22;b.style.minHeight=it.h+'px';}
function togTr(n){const it=cur.items[n];it.showTr=!it.showTr;upd(n);}
function setDk(n,v){if(cur.checked)return;cur.items[n].dk=v;upd(n);}
function pick(n,el){if(cur.checked)return;cur.items[n].ans=el.dataset.v;el.parentNode.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b===el));bar();}
function ins(n,u){const i=document.getElementById('f'+n);const p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+u+i.value.slice(i.selectionEnd??p);cur.items[n].ans=i.value;i.focus();i.setSelectionRange(p+1,p+1);bar();}
function build(n,k){const it=cur.items[n];if(cur.checked||it.ans.includes(k))return;it.ans.push(k);upd(n);}
function unbuild(n,k){if(cur.checked)return;cur.items[n].ans.splice(k,1);upd(n);}
function check(){
  if(cur.checked)return;
  const empty=cur.items.length-answeredCount();
  const m=document.getElementById('msg');
  if(empty&&!cur.warned){cur.warned=true;m.textContent=`${empty} question${empty>1?'s are':' is'} still empty. Tap “Check” again to submit anyway.`;return;}
  cur.items.forEach(it=>{const q=it.q;
    if(it.dk){it.correct=false;return;}
    if(q.t==='m') it.correct=it.ans===q.o[0];
    else if(q.t==='f'){const a=(it.ans||'').trim().replace(/[.!?]$/,'');it.correct=q.a.some(x=>norm(x)===norm(a));it.loose=it.correct&&!q.a.some(x=>x.toLowerCase()===a.toLowerCase());}
    else {const a=norm(it.ans.map(k=>it.bank[k]).join(' '));it.correct=q.a.some(x=>norm(x.split('|').join(' '))===a);}
  });
  cur.checked=true;
  const s=cur.sec;
  if(!cur.retry){const sc=cur.items.filter(i=>i.correct).length,prev=S.done[s.id];
    if(!prev||sc>=prev.score) S.done[s.id]={score:sc,total:cur.items.length};}
  else if(S.done[s.id]){const fixed=cur.items.filter(i=>i.correct).length;S.done[s.id].score=Math.min(S.done[s.id].total,S.done[s.id].score+fixed);}
  save(); renderSec(); window.scrollTo(0,0);
}

/* ---------- result animation ---------- */
function celebrate(){
  const sc=cur.items.filter(i=>i.correct).length,p=sc/cur.items.length;
  const arc=document.getElementById('sarc'),cnt=document.getElementById('cnt');
  if(RM){if(arc)arc.style.strokeDashoffset=arc.dataset.off;if(cnt)cnt.textContent=sc;document.querySelectorAll('.star').forEach(s=>s.classList.add('show'));return;}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(arc)arc.style.strokeDashoffset=arc.dataset.off;}));
  const t0=performance.now(),D=1100;
  (function tick(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);if(cnt)cnt.textContent=Math.round(sc*e);if(k<1)requestAnimationFrame(tick);})(t0);
  document.querySelectorAll('.star').forEach((s,i)=>setTimeout(()=>s.classList.add('show'),700+i*220));
  if(p>=.75) setTimeout(()=>confetti(p===1?160:100),900);
}
function confetti(N){
  const cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  const cols=['#2f6bff','#5cc8ff','#ffd84d','#ffffff','#12b981','#ff7aa2'];
  const ps=Array.from({length:N},()=>({x:W/2,y:H*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*6+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],sh:Math.random()<.5}));
  const t0=performance.now();
  (function f(t){const el=t-t0;x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-el/2600);x.fillStyle=p.c;
      if(p.sh){x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}else{x.beginPath();x.arc(0,0,p.s/2.6,0,7);x.fill()}x.restore();});
    if(el<2600&&document.body.contains(cv))requestAnimationFrame(f);else cv.remove();})(t0);
}
document.addEventListener('visibilitychange',()=>{document.body.style.animationPlayState=document.hidden?'paused':'running'});

home();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
